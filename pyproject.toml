[build-system]
requires = ["setuptools==78.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "incremental-lakehouse"
version = "0.1.0"
description = "Typed CDC, schema contracts and atomically published incremental analytical models"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
incremental-lakehouse = "incremental_lakehouse.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
